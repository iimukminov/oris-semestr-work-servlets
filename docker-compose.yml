version: "3.9"

services:
  app:
    build: .
    container_name: service-desk-app
    ports:
      - "8080:8080"
    depends_on:
      - db

  db:
    image: postgres:17
    container_name: service_desk_db
    environment:
      POSTGRES_DB: service_desk_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: qwerty007
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./01_dump.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  db_data:
